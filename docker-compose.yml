# Fully offline stack: the app plus a local Ollama server. No API keys, no internet at runtime.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b     # one-time, needs internet
#   open http://localhost:8501
services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # GPU (optional, needs NVIDIA container toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

volumes:
  ollama_models:
