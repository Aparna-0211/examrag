name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The unit tests only need pytest; heavy ML deps are imported lazily.
      - run: pip install pytest
      - run: python -m compileall -q src app.py eval
      - run: python -m pytest -q
